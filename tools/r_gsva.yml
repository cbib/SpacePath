# GSVA vignette :
#  https://www.bioconductor.org/packages/release/bioc/vignettes/GSVA/inst/doc/GSVA.html

name: r_gsva 
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - r-base=4.3.3
  - conda-forge::r-xml
  - conda-forge::r-httr
  - conda-forge::r-curl
  - r-abind
  - r-magick
  - r-matrix>=1.6.3
  - r-matrix.utils
  - r-hdf5r
  - r-irlba
  - conda-forge::r-biocmanager
  - conda-forge::r-rjson   # new
  - conda-forge::datatable   # new
  - bioconductor-biocparallel
  - bioconductor-s4vectors
  - bioconductor-delayedarray
  - bioconductor-delayedmatrixstats
  - bioconductor-limma
  - bioconductor-summarizedexperiment
  - bioconductor-gsva

