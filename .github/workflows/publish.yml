name: Publish SpacePath to PyPI

on:
  push:
    tags:
      - "*.*.*" # Triggers the workflow when pushing a version tag
  workflow_dispatch:  #  Allows you to manually trigger this via the GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Trusted Publishing on PyPI
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.18" # Configured for specific Python version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3  
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build package distributions
        run: poetry build # generates build files .whl and .tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

