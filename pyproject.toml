[project]
name = "smpath"
version = "0.0.0"
description = "library for running the Spatial Exploration Method based on Pathway Activity Profiles"
authors = [
{name = "johaGL", email = "johanna.galvis@ibgc.cnrs.fr"}
]

readme = "README.md"


requires-python = ">=3.10,<3.13"

dependencies = [
    "setuptools (>=56.0.0, <56.1.0)",
    "pydantic (>=2.9.2,<3.0)",
    "numpy (>=2.2.6,<3.0)",
    "pandas (>= 2.3.0,<3.0)",
    "openpyxl (>=3.1.5,<4.0)",
    "pyyaml (>=6.0.2,<7.0)",
    "scikit-learn (>=1.7.0,<2.0)",
    "scipy (>=1.15.2,<2.0)",
    "matplotlib (>=3.10.3,<4.0)",
    "seaborn (>=0.13.2,<1.0)",
    "networkx (>=3.4.2,<4.0)",
    "python-igraph (>=0.11.9,<1.0)",
    "coverage (>=7.9.1,<8.0)",
    "click (>=8.2.1,<9.0)",
    "python-dotenv (>=0.5.1,<1.0)",
    "requests (>=2.32.4,<3.0)",
    "tqdm (>=4.67.1,<5.0)",
    "scanpy (>=1.11.2,<2.0)",
    "anndata (>=0.11.4,<1.0)",
    "squidpy (>=1.6.3,<2.0)",
    "pyimzml (>=1.5.1,<2.0)",
    "metaspace-converter (>=1.1.1,<2.0)",
    "rdkit (>=2025.3.3,<2026.0)",
    "fastcluster (>=1.3.0,<2.0)",
    "matplotlib-venn",

]

[tool.poetry]
package-mode = true


[tool.poetry.group.test.dependencies]
pytest ="^8.4.0"
pytest-cov = "^6.2.1"

[tool.poetry.group.dev.dependencies]
flake8 = "^4.0.1"
flake8-import-order="^0.18.1"
mypy = "*"
sphinx = "*"
poetry = "^2.1.3"

[tool.flake8]
max-line-length = 79
max-complexity = 10


[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:sspa.*",
    "ignore::DeprecationWarning:pkg_resources.*" ,
    "ignore::UserWarning:sspa.*",
    "ignore::UserWarning:pkg_resources.*",
    "ignore::UserWarning:rpy2.*",
    "ignore::FutureWarning:squidpy.*",
    "ignore::FutureWarning:dask.*",
    "ignore::FutureWarning:anndata.*"
]
