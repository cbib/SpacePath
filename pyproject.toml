[project]
name = "SpacePath"
version = "0.0.0"
description = "An end-to-end workflow for functional analysis of Spatial Lipidomics data"
authors = [
    {name = "johaGL", email = "johanna.galvis@ibgc.cnrs.fr"}
]

readme = "README.md"

requires-python = ">=3.10,<3.13"

dependencies = [
    "setuptools (>=56.0.0, <56.1.0)",
    "pydantic (>=2.9.2,<3.0)",
    "openpyxl (>=3.1.5,<4.0)",
    "pyyaml (>=6.0.2,<7.0)",
    "coverage (>=7.9.1,<8.0)",
    "click (>=8.2.1,<9.0)",
    "python-dotenv (>=0.5.1,<1.0)",
    "requests (>=2.32.4,<3.0)",
]   # when smpath available as PyPI add here

[tool.poetry]
package-mode = true   # avoid obligation to put packagename in lowercase all
packages = [
    { include = "SpacePath" }
]

[tool.poetry.group.test.dependencies]
pytest ="^8.4.0"
pytest-cov = "^6.2.1"

[tool.poetry.group.dev.dependencies]
flake8 = "^4.0.1"
flake8-import-order="^0.18.1"
mypy = "*"
sphinx = "*"
poetry = "^2.1.3"

[tool.flake8]
max-line-length = 79
max-complexity = 10


[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:sspa.*",
    "ignore::DeprecationWarning:pkg_resources.*" ,
    "ignore::UserWarning:sspa.*",
    "ignore::UserWarning:pkg_resources.*",
    "ignore::UserWarning:rpy2.*",
    "ignore::FutureWarning:squidpy.*",
    "ignore::FutureWarning:dask.*",
    "ignore::FutureWarning:anndata.*"
]

[tool.poetry.scripts]
SpacePath = "SpacePath.__main__:main_cli"