[tool.poetry]
name = "zonist"
version = "0.0.0"
description = "local essays not yet a library"
authors = ["johaGL <johanna.galvis@ibgc.cnrs.fr>"]

readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "2.9.2"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:sspa.*",
    "ignore::DeprecationWarning:pkg_resources.*"  ,
    "ignore::FutureWarning:squidpy.*",
    "ignore::FutureWarning:anndata.*",
    "ignore::FutureWarning:dask.*"
]

